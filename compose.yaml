x-ollama-env: &ollama-env
  COPILOT_EXECUTION_MODE: ${COPILOT_EXECUTION_MODE:-legacy}
  OLLAMA_MODE: ${OLLAMA_MODE:-local-first}
  OLLAMA_LOCAL_HOST: http://host.docker.internal:11434
  # Release native model memory after completion so the Docker VM can deliver it.
  OLLAMA_LOCAL_KEEP_ALIVE: ${OLLAMA_LOCAL_KEEP_ALIVE:-0}
  OLLAMA_LOCAL_THINK: ${OLLAMA_LOCAL_THINK:-default}
  # Pin the accepted full-evidence context even after a native Ollama restart.
  OLLAMA_LOCAL_NUM_CTX: ${OLLAMA_LOCAL_NUM_CTX:-32768}
  OLLAMA_LOCAL_MODEL: ${OLLAMA_LOCAL_MODEL:-qwen3:8b}
  OLLAMA_CLOUD_MODEL: ${OLLAMA_CLOUD_MODEL:-gpt-oss:120b-cloud}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OLLAMA_PROBE_TIMEOUT_MS: ${OLLAMA_PROBE_TIMEOUT_MS:-3000}
  OLLAMA_STREAM_TIMEOUT_MS: ${OLLAMA_STREAM_TIMEOUT_MS:-90000}
  OLLAMA_LOCAL_STREAM_TIMEOUT_MS: ${OLLAMA_LOCAL_STREAM_TIMEOUT_MS:-900000}
services:
  react:
    build:
      context: .
      target: react
    ports: ["127.0.0.1:3000:3000"]
    environment: *ollama-env
    init: true
  streamlit:
    profiles: [streamlit]
    build:
      context: .
      target: streamlit
    ports: ["127.0.0.1:8501:8501"]
    environment: *ollama-env
    init: true
