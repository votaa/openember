# Phase 2 regional geography contract. Bounding boxes are query/validation
# hints; authoritative county geometry comes from the configured NYS boundary
# layer. Rockaway intentionally uses all of Queens Community Board 14 for the
# initial implementation, including Broad Channel.
regions:
  nassau:
    name: Nassau County
    geography: nassau
    county_fips: '36059'
    bbox:
      north: 40.93
      south: 40.53
      east: -73.42
      west: -73.77
    boundary_source_id: nys_civil_boundaries
    scope_method: authoritative_polygon
    boundary_filter:
      field: FIPS_CODE
      value: '36059'
  suffolk:
    name: Suffolk County
    geography: suffolk
    county_fips: '36103'
    bbox:
      north: 41.31
      south: 40.54
      east: -71.85
      west: -73.50
    boundary_source_id: nys_civil_boundaries
    scope_method: authoritative_polygon
    boundary_filter:
      field: FIPS_CODE
      value: '36103'
  rockaway:
    name: Rockaway / Queens Community Board 14
    geography: rockaway
    county_fips: '36081'
    bbox:
      north: 40.67
      south: 40.53
      east: -73.73
      west: -73.96
    boundary_source_id: null
    scope_method: community_board_filter
    boundary_filter:
      borough: QUEENS
      community_board: 14 QUEENS
    includes_broad_channel: true
    future_enhancement: Replace the CB14 filter with an authoritative peninsula polygon to exclude Broad Channel.

# Phase 2 source policy registry. No credentials are stored here. Entries with
# enabled=false must remain unavailable/access_required until their gate is met.
