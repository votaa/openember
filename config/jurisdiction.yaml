knowledge_base:
  flood_zones: 'Zone AE (Special Flood Hazard): Long Beach (entire city), Atlantic
    Beach, Lido Beach, Island Park, Oceanside, Freeport waterfront, Merrick, Massapequa
    bay-front (Nassau); Lindenhurst, Copiague, Amityville Harbor, Bay Shore waterfront,
    Mastic Beach, Shirley, Patchogue, Westhampton Beach, Hampton Bays, Shinnecock
    Bay (Suffolk).

    Zone VE (Coastal High-Hazard / wave action): Fire Island (entire barrier island),
    Jones Beach Island, Long Beach ocean side, Montauk Point, Breezy Point (Queens/NYC).

    Zone X (moderate risk): Inland Nassau and Suffolk north of Southern State Pkwy.

    Storm Surge Zones A-D: ~220,000 LI residents (15%) in Zone A/B.

    Post-Sandy (2012): ~$5.5B LI damage; Nassau ~$3B, Suffolk ~$2.5B. FEMA maps
    substantially revised.

    '
  evac_zones: 'Zone A (highest): Barrier islands — mandatory evacuation ANY hurricane
    or tropical storm. Long Beach, Atlantic Beach, Lido Beach, Point Lookout, Island
    Park (Nassau); Fire Island, Mastic Beach, Shirley, Westhampton Beach oceanside,
    Hampton Bays oceanside, Montauk tip (Suffolk); Rockaways (NYC Zone 1).

    Zone B: Low-lying bay-adjacent areas — evacuate Cat 1+.

    Zone C: Moderate risk inland — evacuate Cat 2+.

    Zone D: Lower risk — evacuate Cat 3+.

    Nassau shelters: Nassau Community College (Garden City), Kellenberg Memorial HS
    (Uniondale), Carey HS (Franklin Square). Alert: text OneNassau to 888777.

    Suffolk: Fire Island — FERRY ONLY evacuation via Bay Shore, Sayville, Patchogue
    terminals. South shore mainland: Southern State Pkwy / Sunrise Hwy. Alert: text
    SuffolkAlerts to 67283.

    Rockaway (NYC Zone 1): Cross Bay Veterans Memorial Bridge + Marine Pkwy Bridge
    egress. Nassau shelters available to NYC Zone 1 evacuees by agreement.

    '
  critical_infrastructure: 'Hospitals — Nassau Level 1 Trauma (3): North Shore University
    Hospital (Manhasset, ACS + NYS DOH Regional L1); Nassau University Medical Center
    (East Meadow, NYS DOH L1); NYU Langone LI (Mineola, ACS L1).

    Nassau Level 2: Mount Sinai South Nassau (Oceanside, formerly South Nassau Communities).

    Suffolk Level 1 Trauma (3): Stony Brook University Hospital (ACS + NYS DOH Regional
    L1, adult + peds); South Shore University Hospital (Bay Shore, ACS L1 Aug 2024,
    NYS DOH state designation pending); Good Samaritan University Hospital (West Islip,
    ACS L1 adult / L2 peds).

    Suffolk Level 2: NYU Langone Suffolk (East Patchogue, ACS-verified Jul 2025);
    Northwell Huntington Hospital.

    Suffolk Level 3 / East End: Southampton Hospital; Peconic Bay Medical Center (Riverhead).

    NOTE: No trauma center on Fire Island, Long Beach barrier island, or Rockaway
    Peninsula itself. South Shore University Hospital NYS state L1 designation still
    pending as of 2025.

    Helipads: North Shore UH (FAA 7NY3/6NK3), NUMC (FAA 0NK4), Stony Brook (FAA 6NY6),
    South Shore UH — critical for medevac routing decisions.

    '
  hazard_profiles: 'HURRICANES: Sandy 2012 (Cat 1) — $5.5B LI damage, 13 LI deaths,
    ~1.1M without power. Primary risk: storm surge (6-10+ ft south shore), not wind.
    Barrier island overwash possible Cat 2+. 15 tropical systems impacted NYS since
    2012; frequency doubled in 6 years (NYS DHSES 2024).

    COASTAL FLOODING: Great South Bay avg 4ft depth — surge rises rapidly. Combined
    ocean surge + bay flooding traps south shore mainland. Key gauges: Kings Point
    (8516945), Fire Island (8515186), Bay Shore (8515102), Battery Park ref (8518750).

    EXTREME HEAT: Fewer cooling centers per capita than NYC. Nassau protocol at Heat
    Index >= 95F. Hempstead, Brentwood, Central Islip — reduced cooling access in
    affordable/senior housing.

    WINTER STORMS / NOREASTERS: Jonas 2016 — 25+ inches Suffolk. LIRR third-rail
    vulnerable. Route 27 and Route 25 single-road dependency for East End communities.

    HAZMAT: Brookhaven National Laboratory (DOE, Upton) — radiological. Bethpage
    Grumman groundwater plume (Nassau) — active CERCLA remediation 2025.

    '
  resources: 'Nassau OEM: 516-573-9600 | 510 Grumman Rd W, Bethpage | nassaucountyny.gov/oem

    Suffolk OEM: 631-852-4900 | 30 Yaphank Ave, Yaphank | scoem.suffolkcountyny.gov

    NYC OEM (Rockaway coordination): 718-422-8700 | nyc.gov/oem

    NYS DHSES Region 1 (LI): 631-952-6599 | 30 Yaphank Ave, Yaphank

    FEMA Region 2: 212-680-3600 | 26 Federal Plaza, Manhattan

    Nassau County PD: 516-573-8800 | Suffolk County PD: 631-852-6000

    NYU Langone LI (Level 1 Trauma): 516-663-0333

    Stony Brook SUMC (Level 1 Trauma): 631-444-4000

    Good Samaritan (Level 1 Trauma): 631-376-3000

    PSEG Long Island (outages): 1-800-490-0075 | National Grid (gas): 1-800-930-5003

    NWS OKX (Upton): 631-924-0517 | USCG Emergency: VHF Ch 16

    Nassau Nixle: text OneNassau to 888777

    SuffolkAlert: text SuffolkAlerts to 67283

    LIRR: 511 | mta.info/lirr

    '

